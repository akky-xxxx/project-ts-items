name: check (react-types)

on:
  pull_request:
    paths:
      - workspaces/packages/types/react-types/**
      - workspaces/packages/configurations/oxfmt-config/package.json
      - workspaces/packages/configurations/oxfmt-config/src/**
      - workspaces/packages/configurations/oxfmt-config/tsconfig.build.json
      - workspaces/packages/configurations/oxfmt-config/tsconfig.json
      - workspaces/packages/configurations/oxlint-config/package.json
      - workspaces/packages/configurations/oxlint-config/src/**
      - workspaces/packages/configurations/oxlint-config/tsconfig.build.json
      - workspaces/packages/configurations/oxlint-config/tsconfig.json
      - workspaces/configurations/cspell/**
      - workspaces/configurations/oxlint/**
      - workspaces/configurations/package.json
      - workspaces/configurations/release/**
      - "!workspaces/configurations/**/*.test.mts"
      - .github/workflows/check-react-types.yml
      - .github/actions/setup/**
      - .node-version
      - bun.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: bun run lint
        working-directory: workspaces/packages/types/react-types

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ["react-18", "react-19", "typescript-5.0"]
    name: test (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: bun run build
        working-directory: workspaces/packages/types/react-types
      - run: bun run "test:$TEST_TARGET"
        env:
          TEST_TARGET: ${{ matrix.target }}
        working-directory: workspaces/packages/types/react-types
