name: check (configurations)

on:
  pull_request:
    paths:
      - workspaces/configurations/**
      - workspaces/packages/configurations/oxfmt-config/package.json
      - workspaces/packages/configurations/oxfmt-config/src/**
      - workspaces/packages/configurations/oxfmt-config/tsconfig.build.json
      - workspaces/packages/configurations/oxfmt-config/tsconfig.json
      - workspaces/packages/configurations/oxlint-config/package.json
      - workspaces/packages/configurations/oxlint-config/src/**
      - workspaces/packages/configurations/oxlint-config/tsconfig.build.json
      - workspaces/packages/configurations/oxlint-config/tsconfig.json
      - .github/workflows/check-configurations.yml
      - .github/actions/setup/**
      - .node-version
      - bun.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: bun run check-code
        working-directory: workspaces/configurations
